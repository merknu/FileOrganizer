[tool:pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=file_handler
    --cov=config
    --cov=gui
    --cov-report=html:tests/coverage_html
    --cov-report=term-missing
    --cov-report=xml:tests/coverage.xml
    --junit-xml=tests/results.xml
    -p no:warnings
markers =
    unit: marks tests as unit tests (deselect with '-m "not unit"')
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    gui: marks tests as GUI tests (deselect with '-m "not gui"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_dependencies: marks tests that require optional dependencies
    file_io: marks tests that perform file I/O operations
    gpu: marks tests that require GPU hardware or GPU libraries
    performance: marks tests that measure performance metrics
    mock: marks tests that use mocked implementations
    cuda: marks tests specific to CUDA/NVIDIA GPUs
    opencl: marks tests specific to OpenCL GPUs
    gpu_required: marks tests that require actual GPU hardware (skip if unavailable)
    gpu_optional: marks tests that can run with or without GPU (adaptive behavior)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:mutagen.*
    ignore::UserWarning:PIL.*
    ignore::UserWarning:moviepy.*
    ignore::UserWarning:cupy.*
    ignore::UserWarning:pycuda.*
    ignore::UserWarning:pyopencl.*
    ignore::RuntimeWarning:cupy.*
    ignore::FutureWarning:numpy.*
minversion = 6.0